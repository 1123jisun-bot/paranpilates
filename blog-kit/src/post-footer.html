<!doctype html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="kit.css">
<style>
.canvas{width:1080px;height:760px;color:var(--ivory);background:var(--blue-deep)}
.photo{opacity:.3;object-position:center 45%}
.shade{background:linear-gradient(180deg,rgba(0,40,85,.55),rgba(0,30,65,.96) 70%)}
.inner{position:absolute;inset:0;padding:80px;display:flex;flex-direction:column}
.logo{height:120px;width:auto;align-self:flex-start;margin-bottom:34px}
.tag{font-size:56px;font-weight:700;letter-spacing:-.05em;line-height:1.25}
.sub{font-size:24px;color:rgba(251,249,245,.8);margin-top:14px}
.rows{margin-top:auto;border-top:1px solid rgba(251,249,245,.25)}
.row{display:flex;align-items:baseline;gap:28px;padding:18px 0;border-bottom:1px solid rgba(251,249,245,.25);font-size:25px;letter-spacing:-.02em}
.row i{flex:none;width:150px;font-family:var(--serif);font-size:28px;color:#8ED8FF}
.cta{position:absolute;right:80px;top:100px;height:74px;padding:0 38px;font-size:26px;background:var(--ivory);color:var(--blue-deep)}
</style></head><body>
<div class="canvas">
  <img class="photo" src="photos/group-clean.jpg" alt="">
  <div class="shade"></div>
  <div class="inner">
    <img class="logo" src="../../img/logo-white.webp" alt="">
    <p class="tag">내 몸에 <span class="grad-light">파란</span>을 일으키자</p>
    <p class="sub">1:1 개인레슨 · 1:2 듀엣레슨 · 1:6 그룹레슨 · 레슨 예약제 운영</p>
    <div class="rows">
      <p class="row"><i>Hours</i>평일 09:00 – 22:00 &nbsp;/&nbsp; 토 09:00 – 13:00 &nbsp;/&nbsp; 일요일 휴무</p>
      <p class="row"><i>Location</i>서울 금천구 가산로 118, 2층 (하모니마트 옆 건물)</p>
      <p class="row"><i>Contact</i>전화 010 6694 4568 &nbsp;·&nbsp; 카톡 파란필라테스</p>
      <p class="row"><i>Mail</i>paranpilates@naver.com</p>
    </div>
  </div>
  <span class="btn cta">네이버 예약·상담 →</span>
</div></body></html>
