<!doctype html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="kit.css">
<style>
.canvas{width:966px;height:400px}
.photo{object-position:center}
.inner{position:absolute;inset:0;padding:48px 56px;display:flex;flex-direction:column;justify-content:center;color:var(--ivory)}
.eyebrow{color:rgba(251,249,245,.75);margin-bottom:22px}
.logo{height:112px;width:auto;margin-bottom:22px;align-self:flex-start}
.tag{font-size:34px;font-weight:700;letter-spacing:-.045em;line-height:1.3;margin-bottom:10px}
.sub{font-size:15px;color:rgba(251,249,245,.82);letter-spacing:-.01em}
.badge{position:absolute;right:48px;bottom:40px;width:118px;height:118px;border-radius:50%;background:rgba(251,249,245,.92);display:grid;place-items:center}
.badge svg{position:absolute;inset:0;width:100%;height:100%}
.badge text{font-size:15.5px;letter-spacing:.14em;fill:var(--blue-deep);font-family:var(--sans);font-weight:500}
.badge span{color:var(--blue);font-size:26px}
</style></head><body>
<div class="canvas">
  <img class="photo" src="photos/hero-title.jpg" alt="">
  <div class="shade"></div>
  <div class="inner">
    <p class="eyebrow">Paran Pilates Studio &nbsp;·&nbsp; Since 2022</p>
    <img class="logo" src="../../img/logo-white.webp" alt="">
    <p class="tag">내 몸에 <span class="grad-light">파란</span>을 일으키자</p>
    <p class="sub">체형 분석에서 시작하는 맞춤 필라테스 &nbsp;·&nbsp; 서울 금천구 가산로</p>
  </div>
  <div class="badge"><svg viewBox="0 0 200 200"><defs><path id="c" d="M100,100 m-74,0 a74,74 0 1,1 148,0 a74,74 0 1,1 -148,0"/></defs><text><textPath href="#c">BODY &amp; MIND · PARAN PILATES · SINCE 2022 ·</textPath></text></svg><span>✳</span></div>
</div></body></html>
