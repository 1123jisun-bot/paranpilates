<!doctype html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="kit.css">
<style>
.canvas{width:1080px;height:1080px}
.photo{object-position:center}
.shade{background:linear-gradient(180deg,rgba(0,32,70,.45) 0%,rgba(0,32,70,.68) 45%,rgba(0,32,70,.88) 100%)}
.inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--ivory)}
.eyebrow{font-size:20px;color:rgba(251,249,245,.78);margin-bottom:36px}
h1{font-family:var(--serif);font-weight:400;font-size:132px;line-height:.92;letter-spacing:-.025em;margin-bottom:44px}
.tag{font-size:50px;font-weight:700;letter-spacing:-.045em}
.sub{margin-top:18px;font-size:24px;color:rgba(251,249,245,.82)}
</style></head><body>
<div class="canvas">
  <img class="photo" src="photos/hero-square.jpg" alt="">
  <div class="shade"></div>
  <div class="inner">
    <p class="eyebrow">Paran Pilates Studio &nbsp;·&nbsp; Since 2022</p>
    <h1>Find your<br><em class="grad-light">center,</em> gently.</h1>
    <p class="tag">내 몸에 <span class="grad-light">파란</span>을 일으키자</p>
    <p class="sub">체형 분석에서 시작하는 맞춤 필라테스</p>
  </div>
</div></body></html>
