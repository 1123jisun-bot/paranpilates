<!doctype html><html lang="ko"><head><meta charset="utf-8"><link rel="stylesheet" href="kit.css">
<style>
.canvas{width:966px;height:300px;background:var(--bg);display:flex;align-items:center;padding:0 60px;gap:56px}
.logo{height:150px;width:auto;flex:none}
.rule{width:1px;align-self:stretch;margin:64px 0;background:var(--line)}
.eyebrow{margin-bottom:14px}
h1{font-family:var(--serif);font-weight:400;font-size:64px;line-height:.95;letter-spacing:-.025em;margin-bottom:18px}
h1 em{padding-left:.1em}
.tag{font-size:20px;font-weight:700;letter-spacing:-.045em}
.tag span{color:var(--blue)}
.star{position:absolute;right:48px;top:36px;color:var(--blue-bright);font-size:22px}
</style></head><body>
<div class="canvas">
  <img class="logo" src="../../img/logo.webp" alt="">
  <div class="rule"></div>
  <div>
    <p class="eyebrow">Paran Pilates Studio &nbsp;·&nbsp; Since 2022</p>
    <h1>Find your<br><em class="grad">center,</em> gently.</h1>
    <p class="tag">내 몸에 <span>파란</span>을 일으키자</p>
  </div>
  <span class="star">✳</span>
</div></body></html>
